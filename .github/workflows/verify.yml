# Trusted public-mirror verification.
#
# This file is installed on projectplanner-ci's default branch. The canonical
# dispatcher first mirrors an exact SHA to a disposable ci/** branch, then
# invokes this workflow on the trusted default branch with that ref as input.
# Agent-authored workflow files on the mirrored branch are never executed.
name: verify
run-name: verify ${{ inputs.source_sha }} (${{ inputs.purpose }})

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Disposable projectplanner-ci tag containing the exact canonical SHA"
        required: true
        type: string
      source_sha:
        description: "Exact canonical SHA to verify and stamp"
        required: true
        type: string
      purpose:
        description: "Audit label only; every purpose runs the identical full gate"
        required: true
        default: head
        type: choice
        options:
          - head
          - merge_group
          - ci_repair

permissions: {}

concurrency:
  group: verify-${{ inputs.source_sha }}
  cancel-in-progress: true

env:
  CANONICAL_REPO: 6th-Element-Labs/projectplanner
  STATUS_CONTEXT: Switchboard CI / VM gate
  TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact-SHA request
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PURPOSE: ${{ inputs.purpose }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^refs/tags/ci/[A-Za-z0-9._/-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PURPOSE" =~ ^(head|merge_group|ci_repair)$ ]]

      - name: Mint status-callback token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SWITCHBOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWITCHBOARD_APP_PRIVATE_KEY }}
          owner: 6th-Element-Labs
          repositories: projectplanner

      - name: Post pending required status
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh api "repos/$CANONICAL_REPO/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="CI: exact-SHA full verification running" \
            -f target_url="$TARGET_URL"

  suite:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      failure_class: ${{ steps.classify.outputs.failure_class }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - name: Check out exact scratchpad ref
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact mirrored SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt -r requirements-ci.txt

      - name: Install Chromium
        # PR heads, merge groups, and CI repairs use the same full gate.
        run: python -m playwright install chromium

      - name: Run Switchboard CI
        id: tests
        continue-on-error: true
        env:
          SWITCHBOARD_CI_STRICT: "1"
          SWITCHBOARD_CI_REQUIRE_NODE: "1"
          SWITCHBOARD_CI_SCOPE: "full"
          SWITCHBOARD_CI_FAIL_FAST: "1"
          UI_PLAYWRIGHT_REPORT: ".artifacts/ui-playwright-receipt.json"
          CI_RESULT_REPORT: ".artifacts/ci-result.json"
        run: |
          unset GITHUB_REPOSITORY
          bash scripts/switchboard_ci.sh

      - name: Upload CI result
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ci-result-${{ inputs.source_sha }}
          path: .artifacts/ci-result.json
          if-no-files-found: warn

      - name: Upload Playwright receipt
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ui-playwright-${{ inputs.source_sha }}
          path: .artifacts/ui-playwright-receipt.json
          if-no-files-found: warn

      - name: Classify result
        id: classify
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$CHECKOUT_OUTCOME" != "success" ]; then
            echo "failure_class=infra" >> "$GITHUB_OUTPUT"
            echo "summary=infra: exact scratchpad checkout failed" >> "$GITHUB_OUTPUT"
          elif [ "$TEST_OUTCOME" != "success" ]; then
            echo "failure_class=tests" >> "$GITHUB_OUTPUT"
            echo "summary=tests: exact-SHA full verification failed" >> "$GITHUB_OUTPUT"
          else
            echo "failure_class=" >> "$GITHUB_OUTPUT"
            echo "summary=tests: exact-SHA full verification passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce suite result
        if: always() && steps.tests.outcome != 'success'
        run: exit 1

  report:
    if: always()
    needs:
      - announce
      - suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint status-callback token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SWITCHBOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWITCHBOARD_APP_PRIVATE_KEY }}
          owner: 6th-Element-Labs
          repositories: projectplanner

      - name: Post one terminal required status
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SUITE_RESULT: ${{ needs.suite.result }}
          FAILURE_CLASS: ${{ needs.suite.outputs.failure_class }}
          SUMMARY: ${{ needs.suite.outputs.summary }}
        run: |
          set -euo pipefail
          state=failure
          description="${SUMMARY:-infra: verification did not start}"
          if [ "$SUITE_RESULT" = "success" ]; then
            state=success
          elif [ -z "$FAILURE_CLASS" ]; then
            description="infra: verification job did not complete"
          fi
          gh api "repos/$CANONICAL_REPO/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
