# CI-14 — push-triggered scratchpad verification.
#
# external_ci_mirror pushes an exact canonical projectplanner SHA to a disposable
# ci/** branch in the public projectplanner-ci repository. This workflow runs the
# mirrored checkout directly, reports the required status to that same canonical
# SHA, and leaves branch deletion to the CI-11 terminal cleanup path.
name: verify

on:
  push:
    branches:
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CANONICAL_REPO: 6th-Element-Labs/projectplanner
  STATUS_CONTEXT: Switchboard CI / VM gate
  UI_STATUS_CONTEXT: Switchboard UI / Playwright
  TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The status callback used to run on a personal access token, whose 5,000/hr is
      # billed to the whole GitHub account. On 2026-07-26 the fleet spent that budget
      # and this very step started failing with `403 API rate limit exceeded` — so no
      # PR could go green, including the one fixing the rate limit. An App installation
      # token is billed to the installation instead. `continue-on-error` keeps the PAT
      # path working until the App secrets are configured; see
      # docs/GITHUB-APP-RATE-LIMIT.md.
      - name: Mint status-callback token (GitHub App)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SWITCHBOARD_APP_ID }}
          private-key: ${{ secrets.SWITCHBOARD_APP_PRIVATE_KEY }}
          owner: 6th-Element-Labs
          repositories: projectplanner

      - name: Assert a status callback credential is available
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "status callback: GitHub App installation token"
          elif [ -n "$TOKEN" ]; then
            echo "status callback: legacy PAT (shared account budget — migrate to the App)"
          else
            echo "infra: no status callback credential on projectplanner-ci. Set" >&2
            echo "SWITCHBOARD_APP_ID + SWITCHBOARD_APP_PRIVATE_KEY (preferred)," >&2
            echo "or PRIVATE_READ_TOKEN." >&2
            exit 1
          fi

      - name: Post pending required status
        env:
          # App token when configured, else the legacy PAT. The scratchpad checkout
          # below uses neither (persist-credentials: false) — this is callback only.
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.PRIVATE_READ_TOKEN }}
        run: |
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description='scratchpad: running full suite' \
            -f target_url="$TARGET_URL"
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context="$UI_STATUS_CONTEXT" \
            -f description='playwright: running required Chromium journey' \
            -f target_url="$TARGET_URL"

      - name: Check out scratchpad branch
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt -r requirements-ci.txt

      - name: Install required Chromium service-cut browser
        run: python -m playwright install --with-deps chromium

      - name: Run Switchboard CI suite
        id: suite
        env:
          SWITCHBOARD_CI_STRICT: "1"
          SWITCHBOARD_CI_REQUIRE_NODE: "1"
          CONCURRENT_LOAD_REPORT: ".artifacts/concurrent-load-report.json"
          UI_PLAYWRIGHT_REPORT: ".artifacts/ui-playwright-receipt.json"
        run: |
          unset GITHUB_REPOSITORY
          bash scripts/switchboard_ci.sh

      - name: Upload concurrent-load SLO report
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: concurrent-load-${{ github.sha }}
          path: .artifacts/concurrent-load-report.json
          if-no-files-found: warn

      - name: Upload UI Playwright receipt
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-${{ github.sha }}
          path: .artifacts/ui-playwright-receipt.json
          if-no-files-found: error

      - name: Post required success status
        if: success()
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.PRIVATE_READ_TOKEN }}
        run: |
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description='tests: full suite passed (scratchpad)' \
            -f target_url="$TARGET_URL"
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="$UI_STATUS_CONTEXT" \
            -f description='playwright: Chromium journey passed with no skips' \
            -f target_url="$TARGET_URL"

      - name: Post tests failure status
        if: failure() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.PRIVATE_READ_TOKEN }}
        run: |
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description='tests: switchboard_ci.sh failed — see run log' \
            -f target_url="$TARGET_URL" || true
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="$UI_STATUS_CONTEXT" \
            -f description='playwright: required Chromium journey failed' \
            -f target_url="$TARGET_URL" || true

      - name: Post infra failure status
        if: failure() && steps.checkout.outcome != 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.PRIVATE_READ_TOKEN }}
        run: |
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description='infra: scratchpad checkout/setup failed — see run log' \
            -f target_url="$TARGET_URL" || true
          gh api "repos/$CANONICAL_REPO/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="$UI_STATUS_CONTEXT" \
            -f description='infra: Playwright checkout/setup failed' \
            -f target_url="$TARGET_URL" || true
