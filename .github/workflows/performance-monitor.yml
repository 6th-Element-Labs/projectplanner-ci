# Scheduled, non-required wall-clock monitoring.
#
# This workflow intentionally posts no status to projectplanner. Timing noise remains
# visible in Actions and artifacts without ejecting a PR or an entire merge group.
name: performance-monitor

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: performance-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint source-read token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SWITCHBOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWITCHBOARD_APP_PRIVATE_KEY }}
          owner: 6th-Element-Labs
          repositories: projectplanner

      - name: Check out canonical master
        uses: actions/checkout@v5
        with:
          repository: 6th-Element-Labs/projectplanner
          ref: master
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt -r requirements-ci.txt

      - name: Run non-blocking timing monitor
        env:
          CONCURRENT_LOAD_REPORT: ".artifacts/concurrent-load-report.json"
          CROSS_PROCESS_LOAD_REPORT: ".artifacts/cross-process-load-report.json"
        run: bash scripts/switchboard_perf_ci.sh

      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-reports-${{ github.run_id }}
          path: |
            .artifacts/concurrent-load-report.json
            .artifacts/cross-process-load-report.json
          if-no-files-found: warn
