# The only path from draft to published.
#
# `docs/RELEASE-TRUST.md`: "APP-7 must invoke this gate for every platform before
# it changes a draft release to published", called from the protected
# `release-signing` environment. This workflow is that invocation, and it is
# deliberately the *only* automated publish path in the repository —
# `release.yml` creates the draft and has no code path that publishes one.
#
# It is manual by design. A tag arriving is not consent to publish; a person
# dispatching this workflow is. The gate then decides whether that consent is
# backed by evidence, and it fails closed on absent credentials, an unverified
# signing result, or a partial smoke test.
name: simplemark-release-promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, e.g. v0.3.1
        required: true
        type: string

# §8: read at the top level; the single job elevates for itself.
permissions:
  contents: read

concurrency:
  group: release-promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == '6th-Element-Labs/projectplanner-ci' && !github.event.repository.private
    name: promote ${{ inputs.tag }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # The mechanism, not a convention: environment secrets are scoped to the
    # jobs that name the environment, so the signing material this gate checks
    # for is unreachable from any pull-request job, including a fork's.
    environment: simplemark-release-signing
    defaults:
      run:
        working-directory: source
    env:
      GH_REPO: 6th-Element-Labs/simplemark
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out trusted public control plane
        uses: actions/checkout@v5
        with:
          path: control
          persist-credentials: false
      - name: Mint token restricted to canonical SimpleMark
        id: source
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SWITCHBOARD_APP_ID }}
          private-key: ${{ secrets.SWITCHBOARD_APP_PRIVATE_KEY }}
          owner: 6th-Element-Labs
          repositories: simplemark
          permission-contents: write
          permission-statuses: write
      - name: Check out exact canonical source
        uses: actions/checkout@v5
        with:
          repository: 6th-Element-Labs/simplemark
          token: ${{ steps.source.outputs.token }}
          ref: ${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Assert the release exists and is still a draft
        env:
          GH_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -euo pipefail
          state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [ "$state" != "true" ]; then
            echo "release-promote: ${RELEASE_TAG} is not a draft; refusing to act" >&2
            exit 1
          fi

      # The evidence is what the gate reads. It is produced by APP-6's smoke
      # lanes and attached to the draft; this workflow never synthesises it,
      # because evidence a workflow wrote about itself proves nothing.
      - name: Download the platform smoke evidence from the draft
        env:
          GH_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/evidence
          gh release download "${RELEASE_TAG}" \
            --dir .artifacts/evidence \
            --pattern 'platform-smoke-*.json'
          ls -l .artifacts/evidence

      # One invocation per platform. Each fails closed on its own, so a partial
      # pass cannot promote: the first missing or incomplete platform ends the
      # job before the publish step is ever reached.
      - name: Verify macos release trust
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: node scripts/verify-release-trust.mjs --target macos --mode public-release --evidence .artifacts/evidence/platform-smoke-macos.json

      - name: Verify windows release trust
        env:
          SIMPLEMARK_WINDOWS_CERTIFICATE: ${{ secrets.SIMPLEMARK_WINDOWS_CERTIFICATE }}
          SIMPLEMARK_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SIMPLEMARK_WINDOWS_CERTIFICATE_PASSWORD }}
          SIMPLEMARK_WINDOWS_TIMESTAMP_URL: ${{ secrets.SIMPLEMARK_WINDOWS_TIMESTAMP_URL }}
        run: node scripts/verify-release-trust.mjs --target windows --mode public-release --evidence .artifacts/evidence/platform-smoke-windows.json

      - name: Verify linux release trust
        run: node scripts/verify-release-trust.mjs --target linux --mode public-release --evidence .artifacts/evidence/platform-smoke-linux.json

      # Reached only when all three gates above passed. Every step before this
      # one is a hard failure, so there is no arrangement of skipped or
      # continued-on-error steps that lands here without the evidence.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false
          echo "release-promote: ${RELEASE_TAG} published after passing every platform trust gate"
