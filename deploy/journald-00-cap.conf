# /etc/systemd/journald.conf.d/00-cap.conf — synced by deploy/redeploy.sh.
# Sized for ≥48h retention on the 29G prod root (2026-07-30 incident: the
# coordinator autopilot's full tick JSON churned the previous 200M cap in ~2h
# and destroyed overnight forensics). Non-autopilot producers burn ~10MB/h raw
# (caddy dominates), so 1G holds days even before journald compression; the
# real fix is the bounded coordinator tick summary in coordinator_daemon.py.
[Journal]
SystemMaxUse=1G
